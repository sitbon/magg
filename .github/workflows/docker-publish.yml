name: Docker

on:
  push:
    branches: [ main, beta ]
    tags: [ 'v*.*.*' ]
    paths:
      - 'magg/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'dockerfile'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    branches: [ main, beta ]
    types: [ opened, synchronize, reopened, labeled ]
    paths:
      - 'magg/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'dockerfile'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-dev-image:
    name: Build Dev Image
    runs-on: ubuntu-latest

    permissions:
      contents: read

    strategy:
      matrix:
        python-version: [ '3.12', '3.13', '3.14' ]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Dev Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfile
          target: dev
          push: false
          load: true
          tags: dev-image:${{ matrix.python-version }}
          build-args: |
            PYTHON_VERSION=${{ matrix.python-version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      - name: Save image as tar
        run: |
          docker save dev-image:${{ matrix.python-version }} -o dev-image-${{ matrix.python-version }}.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dev-image-${{ matrix.python-version }}
          path: dev-image-${{ matrix.python-version }}.tar
          retention-days: 1

  test-dev-image:
    name: Test Dev Container
    runs-on: ubuntu-latest

    needs: build-dev-image
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}  # Only run on branches or PRs, not tags

    permissions:
      contents: read
    
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
      fail-fast: false
    
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: dev-image-${{ matrix.python-version }}

      - name: Load image
        run: |
          docker load -i dev-image-${{ matrix.python-version }}.tar

      - name: Run Container Tests
        run: |
          docker run --rm -e MAGG_LOG_LEVEL= dev-image:${{ matrix.python-version }} pytest -v

  push-dev-image:
    name: Push Dev Images
    runs-on: ubuntu-latest

    needs: [build-dev-image, test-dev-image]
    # On pull requests, images are only pushed when a maintainer adds the
    # 'push-image' label, and never from forks (their GITHUB_TOKEN cannot
    # push packages). Branch and tag pushes always publish.
    if: >-
      ${{ always() && needs.build-dev-image.result == 'success' &&
          (needs.test-dev-image.result == 'success' || needs.test-dev-image.result == 'skipped') &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository &&
            contains(github.event.pull_request.labels.*.name, 'push-image'))) }}

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
      fail-fast: false

    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: dev-image-${{ matrix.python-version }}

      - name: Load image
        run: |
          docker load -i dev-image-${{ matrix.python-version }}.tar

      - name: Log in to registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # pr-NN-dev-py3.XX or pr-NN-dev for 3.14
            type=ref,event=pr,suffix=-dev-py${{ matrix.python-version }}
            type=ref,event=pr,suffix=-dev,enable=${{ matrix.python-version == '3.14' }}

            # branch-dev-py3.XX
            type=ref,event=branch,suffix=-dev-py${{ matrix.python-version }}

            # dev for main branch, only for 3.14
            type=raw,value=dev,enable=${{ matrix.python-version == '3.14' && github.ref_name == 'main' }}

            # branch-dev for other branches, only for 3.14
            type=raw,value=${{ github.ref_name }}-dev,enable=${{ matrix.python-version == '3.14' && github.ref_name != 'main' && startsWith(github.ref, 'refs/heads/') }}

            # This matches v1.2.3 and outputs 1.2.3-dev-py3.XX or 1.2.3-dev for 3.14
            type=semver,pattern=v{{major}}.{{minor}}.{{patch}},pattern={{major}}.{{minor}}.{{patch}},suffix=-dev-py${{ matrix.python-version }}
            type=semver,pattern=v{{major}}.{{minor}}.{{patch}},pattern={{major}}.{{minor}}.{{patch}},suffix=-dev,enable=${{ matrix.python-version == '3.14' }}

            # This matches v1.2 and outputs 1.2-dev-py3.XX or 1.2-dev for 3.14
            type=semver,pattern=v{{major}}.{{minor}},pattern={{major}}.{{minor}},suffix=-dev-py${{ matrix.python-version }}
            type=semver,pattern=v{{major}}.{{minor}},pattern={{major}}.{{minor}},suffix=-dev,enable=${{ matrix.python-version == '3.14' }}

      - name: Tag image with all tags
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while read TAG; do
            docker tag dev-image:${{ matrix.python-version }} $TAG
          done
        shell: bash

      - name: Push all tags
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while read TAG; do
            docker push $TAG
          done
        shell: bash

  build-and-push-image:
    name: Build and Push Image
    runs-on: ubuntu-latest

    needs: [build-dev-image, test-dev-image]
    if: ${{ always() && needs.build-dev-image.result == 'success' && (needs.test-dev-image.result == 'success' || needs.test-dev-image.result == 'skipped') }}

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - target: pro
            suffix: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch,suffix=${{ matrix.suffix }}
            type=ref,event=pr,suffix=${{ matrix.suffix }}
            type=semver,pattern=v{{major}}.{{minor}}.{{patch}},pattern={{major}}.{{minor}}.{{patch}},suffix=${{ matrix.suffix }}
            type=semver,pattern=v{{major}}.{{minor}}.{{patch}},pattern={{major}}.{{minor}},suffix=${{ matrix.suffix }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./dockerfile
          target: ${{ matrix.target }}
          # Same policy as Push Dev Images: PRs only push with the
          # 'push-image' label, and never from forks.
          push: >-
            ${{ github.event_name != 'pull_request' ||
                (github.event.pull_request.head.repo.full_name == github.repository &&
                 contains(github.event.pull_request.labels.*.name, 'push-image')) }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  cleanup-untagged:
    name: Cleanup Untagged Images
    runs-on: ubuntu-latest

    needs: [push-dev-image, build-and-push-image]
    if: ${{ github.event_name != 'pull_request' }}

    permissions:
      packages: write

    steps:
      - name: Delete untagged images
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'magg'
          package-type: 'container'
          delete-only-untagged-versions: 'true'
          min-versions-to-keep: 0
          token: ${{ secrets.GITHUB_TOKEN }}